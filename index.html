<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart Travel Planner</title>
<style>
  *{box-sizing:border-box} body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#f3f6fb;color:#1c2733}
  header{background:linear-gradient(135deg,#0b6e99,#1fa2c9);color:#fff;padding:28px 20px;text-align:center}
  header h1{margin:0 0 6px} main{max-width:1000px;margin:auto;padding:20px}
  section{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px #0001}
  h2{margin-top:0;color:#0b6e99} label{font-size:14px;display:block;margin:8px 0 3px}
  input,select{padding:9px;border:1px solid #c5d0dc;border-radius:8px;width:100%}
  .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  button{background:#0b6e99;color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;margin-top:12px}
  button:hover{background:#085577} button.red{background:#c0392b;padding:6px 12px;margin:0}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
  .card{border:1px solid #dbe4ee;border-radius:10px;padding:14px;background:#fafcff}
  .tag{background:#e1f3fa;color:#0b6e99;padding:2px 8px;border-radius:20px;font-size:12px}
  table{width:100%;border-collapse:collapse} th,td{padding:8px;border-bottom:1px solid #e3e9f0;text-align:left;font-size:14px}
  .msg{margin-top:10px;font-weight:600}
</style>
</head>
<body>
<header><h1>✈️ Smart Travel Planner</h1><p>Tell us your budget, we plan your trip.</p></header>
<main>

<section>
  <h2>1. Plan my trip</h2>
  <div class="row">
    <div><label>Budget (₹)</label><input id="budget" type="number" value="30000"></div>
    <div><label>Days</label><input id="days" type="number" value="4"></div>
    <div><label>Travellers</label><input id="travellers" type="number" value="2"></div>
    <div><label>Trip type</label>
      <select id="type"><option value="">Any</option><option>beach</option><option>mountain</option>
      <option>heritage</option><option>adventure</option><option>nature</option><option>spiritual</option></select></div>
  </div>
  <button onclick="planTrip()">Find Trips</button>
  <div id="plans" class="cards" style="margin-top:14px"></div>
</section>

<section>
  <h2>2. All Destinations</h2>
  <div id="dests" class="cards"></div>
</section>

<section>
  <h2>3. Book a trip</h2>
  <div class="row">
    <div><label>Your name</label><input id="bname"></div>
    <div><label>Email</label><input id="bemail" type="email"></div>
    <div><label>Destination</label><select id="bdest"></select></div>
    <div><label>Travellers</label><input id="btrav" type="number" value="2"></div>
    <div><label>Days</label><input id="bdays" type="number" value="4"></div>
  </div>
  <button onclick="book()">Confirm Booking</button>
  <div id="bmsg" class="msg"></div>
</section>

<section>
  <h2>4. My Bookings</h2>
  <table><thead><tr><th>ID</th><th>Name</th><th>Destination</th><th>People</th><th>Days</th><th>Total ₹</th><th></th></tr></thead>
  <tbody id="bookings"></tbody></table>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

// GET all destinations
async function loadDestinations(){
  const res = await fetch("/api/destinations");
  const data = await res.json();
  $("dests").innerHTML = data.map(d => `
    <div class="card"><b>${d.name}</b> <span class="tag">${d.type}</span>
    <p>${d.state}<br>Best: ${d.best_season}<br>~₹${d.cost_per_day}/day per person</p></div>`).join("");
  $("bdest").innerHTML = data.map(d => `<option value="${d.id}">${d.name}</option>`).join("");
}

// POST /api/plan
async function planTrip(){
  const res = await fetch("/api/plan", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({budget:$("budget").value, days:$("days").value,
      travellers:$("travellers").value, type:$("type").value})});
  const data = await res.json();
  if(!res.ok){ $("plans").innerHTML = `<p>${data.error}</p>`; return; }
  if(data.count === 0){ $("plans").innerHTML = "<p>No trip fits this budget. Try increasing it.</p>"; return; }
  $("plans").innerHTML = data.suggestions.map(s => `
    <div class="card"><b>${s.destination}</b> <span class="tag">${s.type}</span>
    <p>Estimated: <b>₹${s.estimated_cost}</b><br>Left: ₹${s.money_left}<br>Best season: ${s.best_season}</p>
    ${s.itinerary.map(i => `<div>Day ${i.day}: ${i.visit}</div>`).join("")}</div>`).join("");
}

// POST /api/bookings
async function book(){
  const res = await fetch("/api/bookings", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({name:$("bname").value, email:$("bemail").value, destination_id:$("bdest").value,
      travellers:$("btrav").value, days:$("bdays").value})});
  const data = await res.json();
  $("bmsg").textContent = res.ok ? `✅ ${data.message}! Booking #${data.booking_id}, total ₹${data.total_cost}` : "❌ " + data.error;
  loadBookings();
}

// GET /api/bookings
async function loadBookings(){
  const res = await fetch("/api/bookings");
  const data = await res.json();
  $("bookings").innerHTML = data.map(b => `<tr><td>${b.id}</td><td>${b.name}</td><td>${b.destination}</td>
    <td>${b.travellers}</td><td>${b.days}</td><td>${b.total_cost}</td>
    <td><button class="red" onclick="cancelBooking(${b.id})">Cancel</button></td></tr>`).join("");
}

// DELETE /api/bookings/<id>
async function cancelBooking(id){
  await fetch("/api/bookings/" + id, {method:"DELETE"});
  loadBookings();
}

loadDestinations(); loadBookings();
</script>
</body>
</html>
